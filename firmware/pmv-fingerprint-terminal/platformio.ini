; PMV-ONE — ESP32 Fingerprint Attendance Terminal (AS608 + LVGL + WiFi)
;
; เลือก env ให้ตรงบอร์ด:
;   esp32-2432s028  — ESP32-2432S028 / Cheap Yellow Display 2.8" (แนะนำ)
;   esp32dev        — ESP32 DevKit + จอ ILI9341 แยก (SPI ขา 23/18/5/2/4)

[platformio]
default_envs = esp32-2432s028

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
lib_deps =
  adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.0
  bblanchon/ArduinoJson @ ^7.2.0
  lvgl/lvgl @ ^8.3.11
  bodmer/TFT_eSPI @ ^2.5.43
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -I include
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTOUCH_CS=-1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000

; --- ESP32-2432S028 (Cheap Yellow Display) ---
[env:esp32-2432s028]
extends = env
lib_deps =
  ${env.lib_deps}
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
  ${env.build_flags}
  -DTFT_MOSI=13
  -DTFT_MISO=12
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DPMV_TOUCH_XPT2046=1

; --- ESP32 DevKit + ILI9341 module แยก ---
[env:esp32dev]
extends = env
build_flags =
  ${env.build_flags}
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=2
  -DTFT_RST=4
